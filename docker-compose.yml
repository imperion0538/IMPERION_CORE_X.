version: "3.9"

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: imperion
      POSTGRES_PASSWORD: password
      POSTGRES_DB: imperion
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  collector:
    build: ./services/collector
    environment:
      - NATS_URL=nats://nats:4222
      - COINS=${COINS:-BTC,ETH,SOL}
    depends_on:
      - nats

  processor:
    build: ./services/processor
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://imperion:password@timescaledb:5432/imperion
    depends_on:
      - nats
      - redis
      - timescaledb

  api:
    build: ./services/api
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://imperion:password@timescaledb:5432/imperion
      - API_KEY=${API_KEY}
    depends_on:
      - redis
      - timescaledb

  dashboard:
    build: ./services/dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8080
    depends_on:
      - api

volumes:
  timescale_data:

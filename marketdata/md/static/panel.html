/* Portrait mobile: preserve the desktop reference, reflow the same live DOM. */
.mobile-view#viewport{display:block;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain}
.mobile-view #shell{width:100%!important;height:auto!important}
.mobile-view #stage{position:relative;width:100%;height:auto;transform:none!important;background:#030709;overflow:visible;padding:10px 10px calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:9px;font-size:14px}
.mobile-brand{display:none}
.mobile-view .mobile-brand{display:block;grid-column:1/-1;order:0;background:linear-gradient(105deg,#122c20,#100c10 55%,#35131a);border:1px solid #50715c;border-radius:8px;overflow:hidden;text-align:center}
.mobile-brand-art{background-image:var(--reference);background-size:100% auto;background-position:top center;background-repeat:no-repeat;aspect-ratio:1100/120;background-size:139.64% auto}
.mobile-brand h1{font-size:23px;line-height:1.1;margin:9px 6px 3px;letter-spacing:1px;color:#f1f7f3}.mobile-brand h1 span{color:#ff5b65}.mobile-brand p{margin:0 0 10px;font-size:10px;letter-spacing:2px;color:#a9c7b5}
.mobile-view .ticker,.mobile-view .live,.mobile-view .tools,.mobile-view .nav,.mobile-view .status{position:static;width:auto;height:auto;min-width:0}
